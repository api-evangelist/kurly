aid: kurly
name: Kurly
description: >-
  Kurly (컬리, operated by The Farmers Front) is a South Korean online grocery and lifestyle commerce
  company, known for Market Kurly and its overnight "dawn delivery" (샛별배송) model built on a
  cold-chain fulfillment network. Kurly Logistics Services (KLS) opens that network to contracted
  shipper clients (화주사) as a B2B Open API spanning three service families: fulfillment (물류대행),
  where Kurly holds and ships the shipper's stock, covering goods master, inbound receiving,
  inventory and ledgers, outbound orders and fulfillment plans; delivery agency (배송대행), where the
  shipper ships from their own warehouse over Kurly's Nextmile last-mile network; and shared delivery
  tracking. Access is contract-gated — clientId and secretKey are issued only after IP allowlist
  registration — and Kurly states as policy that KLS does not push data to external systems, so
  integrations poll rather than subscribe to webhooks.

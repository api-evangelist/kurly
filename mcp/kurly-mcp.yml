method: derived
status: candidate
source: openapi/
note: Kurly publishes no MCP server. This is a candidate tool surface derived one-to-one from the KLS
  operations captured in openapi/. It is a design starting point, not a Kurly product. Any implementation
  must carry a shipper's own clientId/secretKey and run from an IP-allowlisted host, since KLS gates access
  by source IP.
server:
  name: kurly-kls
  title: Kurly Logistics Services (KLS) Open API
  transport: stdio
  url: null
  auth:
    type: bearer
    token_endpoint: POST /auth/token
    credentials:
    - clientId
    - secretKey
    network: source IP must be allowlisted with Kurly
operational_notes:
- 'No webhooks: KLS does not push to external systems, so a server must poll.'
- Respect the undocumented 429 rate limit; back off on 429.
- Order registration is idempotent via requestKey (delivery-agency) and X-Idempotency-Key (inbound) —
  a tool that retries MUST reuse the same key, never generate a new one.
- Bulk order register/cancel cap at 20 items; by-request-keys lookup caps at 50.

overlay: 1.0.0
info:
  title: API Evangelist enhancements for Kurly KLS — fulfillment
  version: 1.0.0
extends: openapi/kurly-kls-fulfillment-openapi.yml
actions:
- target: $.info
  update:
    x-apievangelist-provider: kurly
    x-apievangelist-artifacts:
      conventions: conventions/kurly-conventions.yml
      errors: errors/kurly-error-codes.yml
      lifecycle: lifecycle/kurly-lifecycle.yml
      changelog: changelog/kurly-changelog.yml
      authentication: authentication/kurly-authentication.yml
      rate_limits: rate-limits/kurly-rate-limits.yml
      vocabulary: vocabulary/kurly-vocabulary.yml
      data_model: data-model/kurly-data-model.yml
      sandbox: sandbox/kurly-sandbox.yml
- target: $
  update:
    x-apievangelist-events:
      webhooks: false
      push: false
      pattern: polling
      source: https://developers.kurly.com/docs/faq
    x-apievangelist-rate-limit:
      status_code: 429
      published_limits: false
      source: https://developers.kurly.com/changelog/1.3.5
- target: $.paths['/openapi/v1/receiving-request'].post
  update:
    x-idempotency:
      header: X-Idempotency-Key
      companion_header: X-Timestamp
      source: https://developers.kurly.com/changelog/1.3.5
